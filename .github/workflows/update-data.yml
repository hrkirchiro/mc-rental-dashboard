name: Quarterly Rental Data Update

on:
  schedule:
    # 8am UTC on Jan 1, Apr 1, Jul 1, Oct 1
    - cron: "0 8 1 * *"
  workflow_dispatch:
    # Also lets you trigger it manually from the GitHub Actions tab anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data.json back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Zillow data and write data.json
        run: python update_data.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Quarterly data update $(date +'%Y-%m-%d')"
          git push
