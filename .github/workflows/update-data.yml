name: Monthly Rental Data Update

on:
  schedule:
    # Runs on the 1st of every month at 8am UTC
    - cron: "0 8 1 * *"
  workflow_dispatch:
    # Also lets you trigger it manually from the GitHub Actions tab anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run data update
        run: python update_data.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Monthly data update $(date +'%Y-%m')"
          git push
